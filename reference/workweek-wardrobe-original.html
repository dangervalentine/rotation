<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workweek Wardrobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style id="css">:root{
  /* Layout: header with view tabs; Rotation view = week grid above the outfit builder; Wardrobe view = cost tiles above the item table */
  --paper:#f2f3f1; --card:#ffffff; --ink:#1c2230; --muted:#5d6472; --line:#d9dcd8;
  --accent:#2f4b7c; --accent-soft:#e3e9f3; --on-accent:#ffffff; --warn:#9a5a12; --warn-soft:#f7ead6; --ok:#2f6b46;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14171d; --card:#1c2029; --ink:#e7e9ee; --muted:#9aa1ae; --line:#2e3441;
  --accent:#8fb0e6; --accent-soft:#243150; --on-accent:#10141c; --warn:#e3a95c; --warn-soft:#3a2c17; --ok:#7cc495; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14171d; --card:#1c2029; --ink:#e7e9ee; --muted:#9aa1ae; --line:#2e3441;
  --accent:#8fb0e6; --accent-soft:#243150; --on-accent:#10141c; --warn:#e3a95c; --warn-soft:#3a2c17; --ok:#7cc495; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--font-body)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 90px;display:grid;gap:22px}
h1,h2{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-0.01em}
h1{font-size:28px} h2{font-size:20px}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{padding:7px 14px;border-radius:7px;color:var(--muted);text-decoration:none;font:500 14px var(--font-body)}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--accent);color:var(--on-accent)}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:150px}
.stat b{display:block;font:600 21px var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.ward{display:grid;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hint{font-size:13px;color:var(--muted)} .hint b{color:var(--ink)}
.rot-layout{display:grid;gap:16px}
.week{display:grid;grid-template-columns:70px repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}
.week+.week{margin-top:12px}
.wklabel{font:600 13px var(--font-display);color:var(--muted);align-self:center}
.day{border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:center;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit}
.day:hover{border-color:var(--accent)}
.day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.day .dn{font:600 14px var(--font-display)}
.edited{font:500 11px var(--font-body);color:var(--warn)}
.day ul{margin:2px 0 0;padding:0;list-style:none;font-size:12px;color:var(--muted);line-height:1.4}
.flag{display:inline-block;margin-top:4px;font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 6px}
.builder-grid{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.builder-grid svg{flex:none}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;flex:1;min-width:240px}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.field.full,.actions.full{grid-column:1/-1}
.sel-trigger{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:36px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:14px var(--font-body);cursor:pointer;text-align:left}
.sel-trigger:hover{border-color:var(--accent)}
.sel-trigger[data-placeholder]{color:var(--muted)}
.sel-icon{color:var(--muted);font-size:12px}
.sel-content{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);min-width:var(--radix-select-trigger-width);max-height:var(--radix-select-content-available-height);overflow:hidden;z-index:50}
.sel-viewport{padding:4px}
.sel-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:6px;font:14px var(--font-body);cursor:pointer;outline:none;user-select:none}
.sel-item[data-highlighted]{background:var(--accent-soft)}
.sel-item[data-state="checked"]{font-weight:500}
.sel-check{color:var(--accent);font-size:12px}
.sel-row{display:inline-flex;align-items:center;gap:8px}
.sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none;display:inline-block}
.sw-none{background:transparent;border-style:dashed}
.namecell{display:inline-flex;align-items:center;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.notice{margin:14px 0 0;font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;font:500 13px var(--font-body);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--warn)}
.day:focus-visible,.btn:focus-visible,.tab:focus-visible,.sel-trigger:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 12px var(--font-display);color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.cat td{font:600 13px var(--font-display);padding-top:16px}
tr.tot td{font-weight:600}
td.muted{color:var(--muted);font-weight:400}
.tablewrap{overflow-x:auto}
a{color:var(--accent)}
form.edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end;background:var(--accent-soft);border-radius:10px;padding:14px;margin-bottom:14px}
form.edit input{font:14px var(--font-body);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:0;width:100%}
form.edit input[type=color]{padding:2px;height:36px}
form.edit input[type=checkbox]{width:auto}
.inline{display:flex;gap:8px;align-items:center}
.err{color:var(--warn);font-size:13px}
.savebar{position:sticky;bottom:12px;justify-self:end;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 14px;box-shadow:0 4px 18px rgba(0,0,0,.08);z-index:5}
.status{font-size:13px;color:var(--muted)}
.status.dirty{color:var(--warn)}
.status.saved{color:var(--ok)}
@media (max-width:900px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}.wklabel{grid-column:1/-1}}
@media (max-width:480px){.week{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
