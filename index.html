<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rotation</title>
    <meta
      name="description"
      content="Track your clothes and their costs, mix them into outfits, plan a weekly rotation, and print it."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%236e1f22'/><text x='16' y='25' text-anchor='middle' font-family='Didot,Bodoni 72,Georgia,serif' font-size='24' fill='%23fbf9f4'>R</text></svg>"
    />
    <meta
      name="theme-color"
      content="#f3efe6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12110f"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      try {
        var t = localStorage.getItem("wardrobe-rotation:theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
